services:
  - type: web
    name: al-basel-real-estate
    runtime: static
    buildCommand: npm ci && npm run typecheck && npm test && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
